[package]
name = "the-crowd-runner"
authors = ["kindaglia <>"]
edition = "2021"

[profile.release]
lto = true

[dependencies.adw]
package = "libadwaita"
version = "0.8.0"
features = ["v1_7"]

[dependencies]
gettext-rs = { version = "0.7", features = ["gettext-system"] }
gtk = { version = "0.10", package = "gtk4", features = ["v4_8"] }
tracing = "0.1.37"
tracing-subscriber = "0.3"
bevy = { version = "0.13.2", features = ["wayland"] }
